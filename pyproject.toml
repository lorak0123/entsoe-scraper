[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entsoe_api"
version = "1.1.0"
description = "A project that uses the ENTSO-E API to fetch and save data."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Karol Pilot", email = "pilot.karol.lh@gmail.com" },
]
keywords = ["entsoe", "energy", "api", "data"]

dependencies = [
    "requests",
    "pandas",
    "click",
    "defusedxml",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "pre-commit",
    "ruff",
    "pytest",
    "pytest-cov",
]

[project.scripts]
entsoe-fetcher = "entsoe_api.scripts.entsoe_fetcher:fetch_entsoe_data"

[tool.setuptools.packages.find]
include = ["entsoe_api*", "entsoe_api.scripts*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "N",
    "UP",
    "D",
    "S",
    "PT",
]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.isort]
known-first-party = ["entsoe_api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D100",
    "D103",
    "D104",
    "S101",
]